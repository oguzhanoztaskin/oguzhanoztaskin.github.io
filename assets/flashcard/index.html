<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <!--
    Make relative asset paths work no matter where the app is hosted:
    /, /assets/flashcard/, /assets/flashcard (no trailing slash) or file://
    Must run before the first <link>/<script> so the base is set while parsing.
  -->
  <script>
    (function () {
      var path = location.pathname;
      var last = path.slice(path.lastIndexOf('/') + 1);
      var base = last === ''            ? path                                  // already a directory
               : last.indexOf('.') > -1 ? path.slice(0, path.length - last.length) // a file: use its folder
               :                          path + '/';                           // extensionless: treat as folder
      document.write('<base href="' + base.replace(/"/g, '%22') + '">');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almanca – Türkçe Kelime Kartları</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">

    <!-- HEADER -->
    <header class="header">
      <h1 class="logo">🇩🇪 ↔ 🇹🇷</h1>
      <p class="subtitle">Almanca – Türkçe Kelime Kartları</p>
    </header>

    <!-- MODE SELECTOR SCREEN -->
    <section id="screen-home" class="screen active">
      <h2>Mod Seç</h2>
      <div class="mode-grid">
        <button class="mode-btn" data-mode="de-tr">
          <span class="mode-icon">🇩🇪 → 🇹🇷</span>
          <span class="mode-label">Almanca → Türkçe</span>
          <span class="mode-desc">Almanca kelimeyi görüp Türkçesini hatırla</span>
        </button>
        <button class="mode-btn" data-mode="tr-de">
          <span class="mode-icon">🇹🇷 → 🇩🇪</span>
          <span class="mode-label">Türkçe → Almanca</span>
          <span class="mode-desc">Türkçe kelimeyi görüp Almancasını hatırla</span>
        </button>
        <button class="mode-btn" data-mode="mixed">
          <span class="mode-icon">🔀</span>
          <span class="mode-label">Karışık Mod</span>
          <span class="mode-desc">Her seferinde rastgele bir yön</span>
        </button>
        <button class="mode-btn" data-mode="quiz">
          <span class="mode-icon">📝</span>
          <span class="mode-label">Test Modu</span>
          <span class="mode-desc">4 seçenekten doğrusunu bul</span>
        </button>
      </div>

      <div class="category-section">
        <label class="section-label">Kategori:</label>
        <div id="category-filters" class="category-filters"></div>
      </div>

      <div class="settings-row">
        <label>
          <input type="checkbox" id="shuffle-toggle" checked />
          Karıştır
        </label>
        <label>
          <input type="checkbox" id="starred-only" />
          Sadece yıldızlılar
        </label>
      </div>

      <button id="btn-start" class="btn-primary">Başla →</button>
    </section>

    <!-- FLASHCARD SCREEN -->
    <section id="screen-flashcard" class="screen">
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="progress-text">
        <span id="progress-label">1 / 20</span>
        <span id="score-label">✅ 0 &nbsp; ❌ 0</span>
      </div>

      <div id="card-scene" class="card-scene">
        <div id="flashcard" class="flashcard">
          <div class="card-face card-front">
            <div class="card-lang" id="front-lang"></div>
            <div class="card-word" id="front-word"></div>
            <div class="card-article" id="front-article"></div>
            <div class="card-hint" id="front-hint">Kartı çevir →</div>
          </div>
          <div class="card-face card-back">
            <div class="card-lang" id="back-lang"></div>
            <div class="card-word" id="back-word"></div>
            <div class="card-article" id="back-article"></div>
            <div class="card-example" id="back-example"></div>
          </div>
        </div>
      </div>

      <div id="action-buttons" class="action-buttons hidden">
        <button id="btn-wrong" class="btn-wrong">❌ Bilmedim</button>
        <button id="btn-star" class="btn-star" title="Yıldızla">☆</button>
        <button id="btn-correct" class="btn-correct">✅ Bildim</button>
      </div>

      <div class="nav-buttons">
        <button id="btn-prev" class="btn-nav">‹ Geri</button>
        <button id="btn-home-fc" class="btn-nav btn-home">Ana Menü</button>
        <button id="btn-next" class="btn-nav">İleri ›</button>
      </div>
    </section>

    <!-- QUIZ SCREEN -->
    <section id="screen-quiz" class="screen">
      <div class="progress-bar-wrap">
        <div id="quiz-progress-bar" class="progress-bar"></div>
      </div>
      <div class="progress-text">
        <span id="quiz-progress-label">1 / 20</span>
        <span id="quiz-score-label">✅ 0 &nbsp; ❌ 0</span>
      </div>

      <div class="quiz-question-box">
        <div class="card-lang" id="quiz-lang"></div>
        <div class="quiz-word" id="quiz-word"></div>
      </div>

      <div id="quiz-options" class="quiz-options"></div>

      <div class="nav-buttons">
        <button id="btn-home-quiz" class="btn-nav btn-home">Ana Menü</button>
      </div>
    </section>

    <!-- RESULTS SCREEN -->
    <section id="screen-results" class="screen">
      <div class="results-box">
        <div class="results-emoji" id="results-emoji">🎉</div>
        <h2>Tamamlandı!</h2>
        <div class="results-stats">
          <div class="stat">
            <span class="stat-num" id="res-correct">0</span>
            <span class="stat-lbl">Doğru</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="res-wrong">0</span>
            <span class="stat-lbl">Yanlış</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="res-pct">0%</span>
            <span class="stat-lbl">Başarı</span>
          </div>
        </div>
        <div id="res-message" class="res-message"></div>
        <div class="results-actions">
          <button id="btn-retry" class="btn-primary">Tekrar Dene</button>
          <button id="btn-wrong-only" class="btn-secondary">Sadece Yanlışlar</button>
          <button id="btn-results-home" class="btn-nav btn-home">Ana Menü</button>
        </div>
      </div>
    </section>

  </div>

  <script src="js/data.js"></script>
  <script src="js/flashcard.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
